<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Summary history · soroagent</title>
  <link rel="stylesheet" href="pages.css">
  <style>
    main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .toolbar input[type="search"] { flex: 1 1 240px; width: auto; }
    .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
    .segmented button { border: none; background: none; padding: 7px 12px; font: inherit; font-size: 13px; color: var(--fg-muted); cursor: pointer; }
    .segmented button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; }
    .filters[hidden] { display: none; }

    /* Cards (both views) */
    .item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
    .item h2 { font-size: 15.5px; margin: 0 0 4px; }
    .meta { font-size: 12.5px; color: var(--fg-muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
    .meta a { color: inherit; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 380px; }
    .site { display: inline-flex; align-items: center; gap: 6px; border: none; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
    .site:hover { color: var(--fg); }
    .avatar { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; color: #fff; flex: none; }
    .summary { margin: 8px 0 0; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .text { margin-top: 10px; font-size: 13px; color: var(--fg-muted); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 7.5em; overflow: hidden; }
    .text.open { max-height: none; color: var(--fg); }
    /* Timeline cards stay compact: the full text appears only when asked for. */
    .item.compact { padding: 12px 14px; }
    .item.compact .text { display: none; }
    .item.compact .text.open { display: block; }
    .item.compact .actions { margin-top: 8px; }
    .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .empty { text-align: center; padding: 48px 16px; color: var(--fg-muted); background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); }

    /* List view */
    .list { display: grid; gap: 12px; }

    /* Timeline view: month index + days with a vertical line */
    .timeline-layout { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 28px; align-items: start; }
    .months { position: sticky; top: 16px; display: grid; gap: 2px; }
    .months-title { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-muted); margin: 0 0 6px 10px; }
    .months button { display: flex; justify-content: space-between; gap: 8px; text-align: left; border: none; background: none; padding: 6px 10px; border-radius: 8px; font: inherit; font-size: 13px; color: var(--fg); cursor: pointer; }
    .months button:hover, .months button.current { background: var(--surface-soft); }
    .months button span { color: var(--fg-muted); }
    .month-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-muted); margin: 26px 0 0; }
    .month:first-child .month-label { margin-top: 0; }
    .day-head {
      position: sticky; top: 0; z-index: 2; display: flex; align-items: baseline; gap: 8px;
      padding: 10px 0 8px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px);
      font-weight: 650; font-size: 15px;
    }
    .day-head small { font-weight: 400; color: var(--fg-muted); font-size: 12.5px; }
    .rail { position: relative; padding-left: 74px; }
    .rail::before { content: ""; position: absolute; left: 61px; top: 4px; bottom: 4px; width: 2px; border-radius: 2px; background: var(--border); }
    .entry { position: relative; margin: 0 0 12px; }
    .entry time { position: absolute; left: -74px; width: 50px; top: 15px; text-align: right; font-size: 12px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
    .entry::before { content: ""; position: absolute; left: -18px; top: 18px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
    @media (max-width: 760px) {
      .timeline-layout { grid-template-columns: 1fr; }
      .months { position: static; display: flex; flex-wrap: wrap; gap: 6px; }
      .months-title { display: none; }
      .months button { border: 1px solid var(--border); }
      .rail { padding-left: 22px; }
      .rail::before { left: 4px; }
      .entry time { position: static; display: block; text-align: left; width: auto; margin-bottom: 4px; }
      .entry::before { left: -23px; top: 4px; }
    }
  
    /* History specifics */
    .status-chip { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--surface-soft); color: var(--fg-muted); }
    .status-chip.running { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
    .status-chip.done { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
    .status-chip.error, .status-chip.interrupted { background: color-mix(in srgb, var(--err) 15%, transparent); color: var(--err); }
    .item h2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .result { margin-top: 10px; font-size: 14px; line-height: 1.55; max-height: 14em; overflow: hidden; position: relative; }
    .result.open { max-height: none; }
    .result:not(.open)::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3em; background: linear-gradient(transparent, var(--surface)); }
    .result p, .result ul, .result ol { margin: 0 0 8px; }
    .result ul, .result ol { padding-left: 20px; }
    .result h3, .result h4 { margin: 10px 0 4px; font-size: 14px; }
    .working { color: var(--fg-muted); font-size: 13px; margin-top: 8px; display: flex; align-items: center; gap: 8px; }
    .working::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite; }
    .problem { color: var(--err); font-size: 13px; margin-top: 8px; }
    .sources { margin: 6px 0 0; padding-left: 20px; font-size: 13px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand"><picture><source srcset="../icons/dark/icon-48.png" media="(prefers-color-scheme: dark)"><img src="../icons/icon-48.png" alt=""></picture><span class="wordmark">soro<span>agent</span></span><span class="crumb">Summary history <span class="muted" id="count"></span></span></div>
    <div class="row"><a class="btn small" href="snippets.html">Saved snippets</a><a class="btn small" href="patterns.html">Browsing pattern</a><a class="btn small" href="options.html">Settings</a></div>
  </header>
  <div class="toolbar">
    <input type="search" id="search" placeholder="Search summaries, pages and sites…" aria-label="Search summaries">
    <div class="segmented" role="group" aria-label="Status">
      <button type="button" data-status="all" aria-pressed="true">All</button>
      <button type="button" data-status="running" aria-pressed="false">Running</button>
      <button type="button" data-status="done" aria-pressed="false">Done</button>
      <button type="button" data-status="failed" aria-pressed="false">Failed</button>
    </div>
    <button class="btn small danger" id="clear" type="button">Delete all</button>
  </div>
  <div class="filters" id="filters" hidden></div>
  <div id="view"></div>
</main>
<footer class="site-foot">tech is art<span class="spark">.</span> © 2026 <a href="https://soroagent.com" target="_blank" rel="noopener">soroagent.com</a> · <a class="feedback-link" href="https://soroagent.com/feedback" target="_blank" rel="noopener">Share feedback</a></footer>
<script src="../shared/config.js"></script>
<script src="../shared/markdown.js"></script>
<script src="../shared/snippets.js"></script>
<script src="../shared/timeline.js"></script>
<script src="../shared/prompts.js"></script>
<script src="../prompts/default.js"></script>
<script src="../shared/ask.js"></script>
<script src="../shared/knowledge.js"></script>
<script src="libchat.js"></script>
<script src="history.js"></script>
</body>
</html>

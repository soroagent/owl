  <style>
    main { max-width: 1240px; margin: 0 auto; padding: 22px 20px 48px; }
    .crumbs { font-size: 13px; margin: 0 0 10px; }
    .crumbs a { text-decoration: none; }
    .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 4px; }
    .meta { color: var(--fg-muted); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .aliases { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .alias { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 12px; background: var(--surface); }
    .alias button { border: none; background: none; color: var(--fg-muted); cursor: pointer; font: inherit; padding: 0 6px; border-radius: 999px; }
    .alias button:hover { color: var(--err); background: var(--surface-soft); }
    .tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .tools select, .tools input { padding: 5px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg); font: inherit; font-size: 12.5px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; margin-top: 18px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
    .panel h2 { font-size: 14px; margin: 0 0 4px; color: var(--heading); }
    .sub { font-size: 12px; color: var(--fg-muted); margin: 0 0 10px; }
    .stance { font-size: 11px; font-weight: 650; border-radius: 999px; padding: 0 7px; }
    .stance.for { background: var(--accent-soft); color: var(--accent); }
    .stance.against { background: var(--spark-soft); color: var(--spark-fg); }
    .month { font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--fg-muted); margin: 16px 0 8px; }
    .month:first-child { margin-top: 0; }
    .dispute { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .dispute > div { border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 13px; }
    .dispute + .dispute { margin-top: 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips a { border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 12px; text-decoration: none; color: var(--fg); background: var(--surface); }
    .chips a:hover { border-color: var(--icon); }
    .chips a small { color: var(--fg-muted); }
    .notes { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .notes a { color: var(--fg); text-decoration: none; font-weight: 550; font-size: 13px; }
    .notes a:hover { color: var(--accent); text-decoration: underline; }
    .notes small { display: block; color: var(--fg-muted); font-size: 11.5px; }
    .empty { text-align: center; padding: 48px 16px; color: var(--fg-muted); background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .dispute { grid-template-columns: 1fr; } }
  </style>
</head>
